name: Release tasks

on:
  push:
    branches: [main]
    paths:
      - "tasks/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: tasks/go.sum

      - name: Test
        working-directory: tasks
        run: go vet ./... && go test ./...

      - name: Build
        working-directory: tasks
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build \
            -ldflags "-s -w" \
            -trimpath \
            -o "../dist/task-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" \
            .

      - uses: actions/upload-artifact@v5
        with:
          name: task-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist/
          merge-multiple: true

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tasks-latest
          name: tasks latest (${{ github.sha }})
          prerelease: true
          files: dist/**
